name: Deploy

# Runs only when started by hand. Create a "production" environment with these secrets:
# DEPLOY_HOST (user@host), DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS and DEPLOY_PATH.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Image version, such as sha-abc1234 or latest
        required: true
        default: latest

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Update the server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "Invalid version."; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy
          ssh -i ~/.ssh/id_deploy "$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && git pull --ff-only && ./deploy/update.sh '$VERSION'"
