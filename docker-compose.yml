name: llm-rudder

services:
  gateway:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: llm-rudder-gateway:local
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      DATABASE_URL: mysql://llmr:${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}@mysql:3306/llm_rudder
    volumes:
      - ./config:/app/config:ro
      - gateway-state:/state
    ports:
      # Only reachable from this host. Caddy or Nginx handles public traffic.
      - 127.0.0.1:${LLMR_PORT:-4141}:4141
    depends_on:
      mysql:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Lets active streams finish during an update.
    stop_grace_period: 5m

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: llm_rudder
      MYSQL_USER: llmr
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Web dashboard: docker compose --profile dashboard up -d
  dashboard:
    build:
      context: .
      dockerfile: deploy/dashboard.Dockerfile
    image: llm-rudder-dashboard:local
    profiles: [dashboard]
    restart: unless-stopped
    init: true
    environment:
      LLMR_GATEWAY_URL: http://gateway:4141
      LLMR_ADMIN_KEY: ${LLMR_ADMIN_KEY:-}
      LLMR_DASHBOARD_PASSWORD_HASH: ${LLMR_DASHBOARD_PASSWORD_HASH:-}
      LLMR_DASHBOARD_SESSION_SECRET: ${LLMR_DASHBOARD_SESSION_SECRET:-}
    ports:
      - 127.0.0.1:${LLMR_DASHBOARD_PORT:-4150}:3000
    depends_on:
      - gateway
    read_only: true
    tmpfs:
      - /tmp
      - /app/apps/dashboard/.next/cache:uid=1000,gid=1000
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Metrics and charts: docker compose --profile monitoring up -d
  prometheus:
    image: prom/prometheus:v3.15.1
    profiles: [monitoring]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    secrets:
      - metrics-key
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - gateway

  grafana:
    image: grafana/grafana:13.2.6
    profiles: [monitoring]
    restart: unless-stopped
    # Refuses to start without a password, rather than using Grafana's default one.
    entrypoint:
      - sh
      - -c
      - '[ -n "$$GF_SECURITY_ADMIN_PASSWORD" ] || { echo "Set LLMR_GRAFANA_PASSWORD in .env."; exit 1; }; exec /run.sh'
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${LLMR_GRAFANA_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    ports:
      - 127.0.0.1:${LLMR_GRAFANA_PORT:-3001}:3000
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  # Use on a fresh VPS: docker compose --profile caddy up -d
  caddy:
    image: caddy:2-alpine
    profiles: [caddy]
    restart: unless-stopped
    environment:
      LLMR_DOMAIN: ${LLMR_DOMAIN:-}
      LLMR_CHAT_DOMAIN: ${LLMR_CHAT_DOMAIN:-chat.localhost}
      LLMR_DASHBOARD_DOMAIN: ${LLMR_DASHBOARD_DOMAIN:-dashboard.localhost}
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - gateway

  # Optional chat UI: docker compose --profile chat up -d
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.13.3
    profiles: [chat]
    restart: unless-stopped
    environment:
      OPENAI_API_BASE_URL: http://gateway:4141/v1
      OPENAI_API_KEY: ${LLMR_KEY_CHAT_UI:-}
      ENABLE_OLLAMA_API: "false"
      # Sends the chat ID, so the gateway can recognize each conversation.
      ENABLE_FORWARD_USER_INFO_HEADERS: "true"
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:-}
    ports:
      - 127.0.0.1:${LLMR_CHAT_PORT:-3000}:8080
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      - gateway

secrets:
  metrics-key:
    environment: LLMR_METRICS_KEY

volumes:
  prometheus-data:
  grafana-data:
  gateway-state:
  mysql-data:
  caddy-data:
  caddy-config:
  open-webui-data:
