global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: llm-rudder
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics-key
    # Finds every gateway instance, however many are running.
    dns_sd_configs:
      - names: ["gateway"]
        type: A
        port: 4141
        refresh_interval: 15s
