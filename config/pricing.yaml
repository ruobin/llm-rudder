# USD per 1M tokens, used for budgets and usage reports. Check provider pages before relying on it.
version: "2026-11-18"

# Used for models not listed below, so that unknown models count against budgets.
default: { input: 10, output: 50 }

models:
  # OpenAI
  gpt-6-astra: { input: 10, output: 50 }
  gpt-6.1-sol: { input: 2, output: 10 }
  gpt-6.1-terra: { input: 1, output: 5 }
  gpt-6-luna: { input: 0.1, output: 0.5 }

  # Google. Carbon, Argon and 3.8 Flash use the higher prices that start on the
  # date Google has announced, so budgets stay on the safe side until then.
  gemini-4-carbon: { input: 4, output: 20, cached_input: 0.2 } # from 2026-12-01
  gemini-4-argon: { input: 4, output: 20, cached_input: 0.2 } # from 2026-12-01
  gemini-4-hydrogen: { input: 1.5, output: 7.5, cached_input: 0.075 }
  gemini-3.8-flash: { input: 1.5, output: 7.5, cached_input: 0.15 } # from 2027-01-01
  gemini-3.5-flash-lite: { input: 0.3, output: 2.5, cached_input: 0.03 }

  # Anthropic
  claude-fable-5-2: { input: 8, output: 40, cached_input: 0.2 }
  claude-opus-5-5: { input: 4, output: 20, cached_input: 0.2 }
  claude-sonnet-5-5: { input: 2, output: 10, cached_input: 0.1 }
  claude-haiku-5-5: { input: 0.1, output: 0.5 }
