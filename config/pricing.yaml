# USD per 1M tokens, used for budgets and usage reports. Check provider pages before relying on it.
version: "2026-11-18"

# Used for models not listed below, so that unknown models count against budgets.
default: { input: 10, output: 50 }

models:
  # OpenAI. Above 272,000 input tokens the long-context prices apply. Writes are for
  # 30-minute and 12-hour explicit caching.
  gpt-6.2-astra:
    input: 8
    output: 40
    cached_input: 0.4
    cache_write_5m: 10
    cache_write_1h: 20
    long_context:
      {
        over_input_tokens: 272000,
        input: 16,
        output: 60,
        cached_input: 0.8,
        cache_write_5m: 20,
        cache_write_1h: 40,
      }
  gpt-6.2-sol:
    input: 2
    output: 10
    cached_input: 0.1
    cache_write_5m: 2.5
    cache_write_1h: 5
    long_context:
      {
        over_input_tokens: 272000,
        input: 4,
        output: 15,
        cached_input: 0.2,
        cache_write_5m: 5,
        cache_write_1h: 10,
      }
  gpt-6-astra:
    input: 10
    output: 50
    cached_input: 1
    cache_write_5m: 12.5
    cache_write_1h: 25
    long_context:
      {
        over_input_tokens: 272000,
        input: 20,
        output: 75,
        cached_input: 2,
        cache_write_5m: 25,
        cache_write_1h: 50,
      }
  gpt-6.1-sol:
    input: 2
    output: 10
    cached_input: 0.1
    cache_write_5m: 2.5
    cache_write_1h: 5
    long_context:
      {
        over_input_tokens: 272000,
        input: 4,
        output: 15,
        cached_input: 0.2,
        cache_write_5m: 5,
        cache_write_1h: 10,
      }
  gpt-6.1-terra:
    input: 1
    output: 5
    cached_input: 0.05
    cache_write_5m: 1.25
    cache_write_1h: 2.5
    long_context:
      {
        over_input_tokens: 272000,
        input: 2,
        output: 7.5,
        cached_input: 0.1,
        cache_write_5m: 2.5,
        cache_write_1h: 5,
      }
  gpt-6-luna:
    input: 0.1
    output: 0.5
    cached_input: 0.01
    cache_write_5m: 0.125
    cache_write_1h: 0.25
    long_context:
      {
        over_input_tokens: 272000,
        input: 0.2,
        output: 0.75,
        cached_input: 0.02,
        cache_write_5m: 0.25,
        cache_write_1h: 0.5,
      }

  # Google. Carbon, Argon and 3.8 Flash use the higher prices that start on the
  # date Google has announced, so budgets stay on the safe side until then.
  gemini-4-carbon: { input: 4, output: 20, cached_input: 0.2 } # from 2026-12-01
  gemini-4-argon: { input: 4, output: 20, cached_input: 0.2 } # from 2026-12-01
  gemini-4-hydrogen: { input: 1.5, output: 7.5, cached_input: 0.075 }
  gemini-3.8-flash: { input: 1.5, output: 7.5, cached_input: 0.15 } # from 2027-01-01
  gemini-3.5-flash-lite: { input: 0.3, output: 2.5, cached_input: 0.03 }

  # Anthropic. Cache writes last 5 minutes or 1 hour. Haiku costs more above 100,000 input tokens.
  claude-fable-5-2:
    { input: 8, output: 40, cached_input: 0.2, cache_write_5m: 10, cache_write_1h: 16 }
  claude-opus-5-5: { input: 4, output: 20, cached_input: 0.2, cache_write_5m: 5, cache_write_1h: 8 }
  claude-sonnet-5-5:
    { input: 2, output: 10, cached_input: 0.1, cache_write_5m: 2.5, cache_write_1h: 4 }
  claude-haiku-5-5:
    input: 0.1
    output: 0.5
    cached_input: 0.01
    cache_write_5m: 0.125
    cache_write_1h: 0.2
    long_context:
      over_input_tokens: 100000
      input: 0.5
      output: 2.5
      cached_input: 0.05
      cache_write_5m: 0.625
      cache_write_1h: 1
